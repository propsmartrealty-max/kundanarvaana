<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="floorGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#B8932C" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>
    <linearGradient id="livingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E10" />
      <stop offset="100%" stop-color="#14110C" />
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#0A0D12" />
  <rect width="1000" height="700" fill="url(#floorGrid2)" />

  <rect x="80" y="80" width="840" height="540" fill="#12161F" stroke="#CCAA4B" stroke-width="3" rx="8" />

  <!-- Palatial Double-Height Living -->
  <rect x="210" y="150" width="400" height="320" fill="url(#livingGrad2)" stroke="#CCAA4B" stroke-width="2" />
  <text x="410" y="270" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="16" font-weight="bold" text-anchor="middle">PALATIAL DOUBLE-HEIGHT GREAT ROOM</text>
  <text x="410" y="295" fill="#F6E05E" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">31' 0" × 19' 6" • 22-FT CLEAR CEILING</text>
  <text x="410" y="320" fill="#A0AEC0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">Triple-Aspect Panoramic Sightlines to Baner Hills</text>

  <!-- Wraparound Terrace -->
  <rect x="210" y="80" width="400" height="70" fill="#14211D" stroke="#48BB78" stroke-width="2" stroke-dasharray="4,4" />
  <text x="410" y="122" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WRAPAROUND SUNSET SKY TERRACE (28' 0" × 8' 0")</text>

  <!-- 0.5 Private Media Lounge / Executive Den -->
  <rect x="210" y="470" width="180" height="150" fill="#201726" stroke="#9F7AEA" stroke-width="1.5" />
  <text x="300" y="535" fill="#E9D8FD" font-family="'Cinzel', serif" font-size="11" font-weight="bold" text-anchor="middle">FAMILY MEDIA DEN</text>
  <text x="300" y="555" fill="#F6E05E" font-family="monospace" font-size="9" text-anchor="middle">12' 6" × 11' 0" (0.5 ROOM)</text>
  <text x="300" y="572" fill="#D6BCFA" font-family="sans-serif" font-size="8" text-anchor="middle">Convertible Boardroom / Study</text>

  <!-- Master Grand Pent-Suite -->
  <rect x="610" y="80" width="310" height="280" fill="#1C1812" stroke="#CCAA4B" stroke-width="2" />
  <text x="765" y="160" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="middle">MASTER GRAND PENT-SUITE</text>
  <text x="765" y="180" fill="#F6E05E" font-family="monospace" font-size="12" text-anchor="middle">21' 0" × 16' 0"</text>
  <text x="765" y="200" fill="#A0AEC0" font-family="sans-serif" font-size="9" text-anchor="middle">Dual Walk-In Closets + Spa Bathroom</text>

  <!-- Junior Suite 2 -->
  <rect x="610" y="360" width="310" height="260" fill="#181B22" stroke="#B8932C" />
  <text x="765" y="480" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="13" font-weight="bold" text-anchor="middle">JUNIOR PRESIDENTIAL SUITE 2</text>
  <text x="765" y="500" fill="#F6E05E" font-family="monospace" font-size="11" text-anchor="middle">16' 8" × 14' 6"</text>

  <!-- Island Kitchen -->
  <rect x="80" y="220" width="130" height="170" fill="#1F1B17" stroke="#B8932C" />
  <text x="145" y="295" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ISLAND KITCHEN</text>
  <text x="145" y="315" fill="#F6E05E" font-family="monospace" font-size="9" text-anchor="middle">16' 6" × 11' 6"</text>

  <!-- Suite 3 -->
  <rect x="390" y="470" width="220" height="150" fill="#161B24" stroke="#4A5568" />
  <text x="500" y="535" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GUEST SANCTUARY 3</text>
  <text x="500" y="555" fill="#F6E05E" font-family="monospace" font-size="9" text-anchor="middle">15' 0" × 13' 0"</text>

  <!-- Blueprint Title -->
  <g transform="translate(100, 45)">
    <text x="0" y="0" fill="#CCAA4B" font-family="'Cinzel', serif" font-size="18" font-weight="bold">4.5 BHK PRESIDENTIAL RESIDENCE BLUEPRINT</text>
    <text x="440" y="0" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">RERA CARPET: <tspan fill="#F6E05E" font-weight="bold">2,269 SQ.FT</tspan> | USABLE: <tspan fill="#F6E05E" font-weight="bold">2,620 SQ.FT</tspan></text>
  </g>
</svg>