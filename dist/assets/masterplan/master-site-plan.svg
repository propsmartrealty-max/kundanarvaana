<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A14" />
      <stop offset="100%" stop-color="#070F0B" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E232B" />
      <stop offset="100%" stop-color="#14181F" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2314" />
      <stop offset="50%" stop-color="#1B1710" />
      <stop offset="100%" stop-color="#0D0B08" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#B8932C" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#07090C" />
  <rect width="1000" height="700" fill="url(#grid)" />

  <!-- Outer Boundary of 1.1 Acre Site -->
  <polygon points="120,80 880,80 880,620 120,620" fill="url(#grass)" stroke="#B8932C" stroke-width="2" stroke-dasharray="8,4" />

  <!-- Road Access -->
  <rect x="0" y="630" width="1000" height="70" fill="url(#road)" />
  <line x1="0" y1="665" x2="1000" y2="665" stroke="#FFFFFF" stroke-dasharray="16,12" stroke-width="2" opacity="0.3" />
  <text x="500" y="672" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="4">24-METER BALWADI ARTERIAL HIGH STREET PROMENADE</text>

  <!-- Grand Entry & Security Portal -->
  <rect x="420" y="600" width="160" height="30" fill="#CCAA4B" rx="4" />
  <text x="500" y="620" fill="#07090C" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GRAND ENTRANCE & RFID SECURITY GATE</text>

  <!-- Internal Vehicular Boulevard (Drop-off loop) -->
  <path d="M 440 600 C 440 450, 260 450, 260 300 C 260 160, 740 160, 740 300 C 740 450, 560 450, 560 600" fill="none" stroke="#2A323D" stroke-width="36" stroke-linecap="round" />
  <path d="M 440 600 C 440 450, 260 450, 260 300 C 260 160, 740 160, 740 300 C 740 450, 560 450, 560 600" fill="none" stroke="#CCAA4B" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Tower Footprint (33 Storeys Landmark Citadel) -->
  <g transform="translate(360, 200)">
    <rect x="0" y="0" width="280" height="240" rx="12" fill="url(#towerGrad)" stroke="#CCAA4B" stroke-width="3" />
    <!-- Tower Core -->
    <rect x="80" y="70" width="120" height="100" fill="#171C26" stroke="#B8932C" stroke-width="1.5" />
    <text x="140" y="115" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIFT & SERVICE CORE</text>
    <text x="140" y="135" fill="#CCAA4B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">4 High-Speed Lifts</text>

    <!-- Unit A & Unit B Wing Separation -->
    <line x1="140" y1="0" x2="140" y2="70" stroke="#CCAA4B" stroke-dasharray="4,4" />
    <line x1="140" y1="170" x2="140" y2="240" stroke="#CCAA4B" stroke-dasharray="4,4" />
    <text x="60" y="45" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="14" font-weight="bold">RESIDENCE A</text>
    <text x="60" y="60" fill="#B8932C" font-family="sans-serif" font-size="10">2,160 SQ.FT (4 BHK)</text>
    <text x="220" y="45" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="end">RESIDENCE B</text>
    <text x="220" y="60" fill="#B8932C" font-family="sans-serif" font-size="10" text-anchor="end">2,269 SQ.FT (4.5 BHK)</text>

    <!-- Double Height Balcony Projection -->
    <path d="M -15 30 L 0 30 L 0 210 L -15 210 Z" fill="#CCAA4B" fill-opacity="0.3" stroke="#CCAA4B" stroke-width="1.5" />
    <path d="M 280 30 L 295 30 L 295 210 L 280 210 Z" fill="#CCAA4B" fill-opacity="0.3" stroke="#CCAA4B" stroke-width="1.5" />
    <text x="-8" y="125" fill="#CCAA4B" font-family="sans-serif" font-size="8" transform="rotate(-90 -8 125)" text-anchor="middle">SKY SUNDECK</text>
    <text x="288" y="125" fill="#CCAA4B" font-family="sans-serif" font-size="8" transform="rotate(90 288 125)" text-anchor="middle">SKY SUNDECK</text>

    <!-- Central Tower Label -->
    <text x="140" y="215" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">KUNDAN ARVAANA TOWER</text>
    <text x="140" y="230" fill="#CCAA4B" font-family="sans-serif" font-size="9" text-anchor="middle">33 Habitable Levels (66 Units Total)</text>
  </g>

  <!-- Left Side: Children's Play Zone & Miyawaki Forest -->
  <circle cx="210" cy="220" r="50" fill="#143020" stroke="#256B3A" stroke-width="2" />
  <text x="210" y="218" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MIYAWAKI</text>
  <text x="210" y="232" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">MICRO-FOREST</text>

  <rect x="150" y="360" width="100" height="90" rx="8" fill="#1C241E" stroke="#48BB78" stroke-width="1.5" />
  <text x="200" y="400" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CHILDREN'S</text>
  <text x="200" y="415" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">PLAY FOREST</text>

  <!-- Right Side: Amphitheater & Party Lawn -->
  <path d="M 750 200 A 60 60 0 0 1 850 300 L 750 300 Z" fill="#291F12" stroke="#CCAA4B" stroke-width="1.5" />
  <text x="785" y="260" fill="#F6E05E" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AMPHITHEATER</text>

  <rect x="740" y="360" width="110" height="90" rx="8" fill="#143020" stroke="#48BB78" stroke-width="1.5" />
  <text x="795" y="400" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ZEN PARTY</text>
  <text x="795" y="415" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">LAWN & POD</text>

  <!-- Ramp to 3 Basements -->
  <polygon points="300,520 370,520 390,580 320,580" fill="#1A202C" stroke="#B8932C" stroke-width="1.5" />
  <text x="345" y="555" fill="#E2E8F0" font-family="sans-serif" font-size="9" font-weight="bold" transform="rotate(-30 345 555)">RAMP TO B1-B3 PARKING</text>

  <!-- Title & Legend Box -->
  <g transform="translate(140, 100)">
    <text x="0" y="0" fill="#CCAA4B" font-family="'Cinzel', serif" font-size="20" font-weight="bold" letter-spacing="1">MASTER SITE LAYOUT PLAN</text>
    <text x="0" y="20" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">KUNDAN ARVAANA • BALEWADI, PUNE WEST</text>
    <text x="0" y="36" fill="#A0AEC0" font-family="monospace" font-size="10">Site Area: ~1.1 Acres | MahaRERA: PR1260002600277</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(850, 130)">
    <circle cx="0" cy="0" r="28" fill="#0E1217" stroke="#CCAA4B" stroke-width="1.5" />
    <polygon points="0,-22 6,0 0,-4 -6,0" fill="#CCAA4B" />
    <polygon points="0,22 6,0 0,4 -6,0" fill="#718096" />
    <text x="0" y="-25" fill="#CCAA4B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">N</text>
  </g>
</svg>