<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="floorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#B8932C" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>
    <linearGradient id="livingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221D13" />
      <stop offset="100%" stop-color="#14120D" />
    </linearGradient>
    <linearGradient id="balconyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2421" />
      <stop offset="100%" stop-color="#0E1412" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="700" fill="#0A0D12" />
  <rect width="1000" height="700" fill="url(#floorGrid)" />

  <!-- Outer Architectural Boundary -->
  <rect x="80" y="80" width="840" height="540" fill="#12161F" stroke="#CCAA4B" stroke-width="3" rx="8" />

  <!-- 1. Private Biometric Lift Foyer -->
  <rect x="80" y="240" width="130" height="150" fill="#1A202C" stroke="#B8932C" stroke-width="1.5" />
  <text x="145" y="295" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PRIVATE</text>
  <text x="145" y="310" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIFT FOYER</text>
  <text x="145" y="328" fill="#CCAA4B" font-family="monospace" font-size="9" text-anchor="middle">8'0" × 10'6"</text>

  <!-- 2. Double Height Grand Living & Dining Pavilion -->
  <rect x="210" y="160" width="370" height="310" fill="url(#livingGrad)" stroke="#CCAA4B" stroke-width="2" />
  <text x="395" y="270" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">DOUBLE-HEIGHT GRAND LIVING &amp; DINING</text>
  <text x="395" y="295" fill="#F6E05E" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">28' 6" × 18' 0" • 22-FT CLEAR CEILING</text>
  <text x="395" y="320" fill="#A0AEC0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">Italian Botticino Marble Flooring • 270° Panoramic Acoustic Glass</text>

  <!-- 3. Wraparound Sky Sundeck -->
  <rect x="210" y="80" width="370" height="80" fill="url(#balconyGrad)" stroke="#48BB78" stroke-width="2" stroke-dasharray="4,4" />
  <text x="395" y="120" fill="#A3E6B5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">EXPANSIVE SKY SUNDECK</text>
  <text x="395" y="138" fill="#F6E05E" font-family="monospace" font-size="11" text-anchor="middle">24' 0" × 7' 6" • Glass Railing</text>

  <!-- 4. Master Presidential Suite Wing -->
  <rect x="580" y="80" width="340" height="270" fill="#1A1813" stroke="#B8932C" stroke-width="1.5" />
  <text x="750" y="150" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="middle">MASTER PRESIDENTIAL SUITE</text>
  <text x="750" y="170" fill="#F6E05E" font-family="monospace" font-size="11" text-anchor="middle">19' 2" × 15' 6"</text>
  
  <!-- Master Walk-in Wardrobe & 5-Fixture Bath -->
  <rect x="600" y="220" width="140" height="110" fill="#151922" stroke="#4A5568" />
  <text x="670" y="270" fill="#CBD5E0" font-family="sans-serif" font-size="10" text-anchor="middle">WALK-IN BOUTIQUE</text>
  <text x="670" y="285" fill="#A0AEC0" font-family="monospace" font-size="8" text-anchor="middle">8'6" × 7'0"</text>

  <rect x="760" y="220" width="140" height="110" fill="#151922" stroke="#4A5568" />
  <text x="830" y="270" fill="#CBD5E0" font-family="sans-serif" font-size="10" text-anchor="middle">5-FIXTURE BATH</text>
  <text x="830" y="285" fill="#A0AEC0" font-family="monospace" font-size="8" text-anchor="middle">Freestanding Soaking Tub</text>

  <!-- 5. Junior Master Suite 2 -->
  <rect x="580" y="350" width="340" height="270" fill="#181920" stroke="#B8932C" stroke-width="1.5" />
  <text x="750" y="460" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="13" font-weight="bold" text-anchor="middle">JUNIOR MASTER SUITE 2</text>
  <text x="750" y="480" fill="#F6E05E" font-family="monospace" font-size="11" text-anchor="middle">16' 4" × 14' 0" + Private Balcony</text>

  <!-- 6. Guest Suite 3 -->
  <rect x="210" y="470" width="200" height="150" fill="#161A22" stroke="#4A5568" />
  <text x="310" y="540" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GUEST SUITE 3</text>
  <text x="310" y="558" fill="#F6E05E" font-family="monospace" font-size="9" text-anchor="middle">14' 8" × 12' 6"</text>

  <!-- 7. Children's Suite / Study 4 -->
  <rect x="410" y="470" width="170" height="150" fill="#161A22" stroke="#4A5568" />
  <text x="495" y="540" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BEDROOM / STUDY 4</text>
  <text x="495" y="558" fill="#F6E05E" font-family="monospace" font-size="9" text-anchor="middle">13' 6" × 12' 0"</text>

  <!-- 8. Gourmet Show Kitchen & Dry/Wet Prep -->
  <rect x="80" y="390" width="130" height="140" fill="#1E1A16" stroke="#B8932C" />
  <text x="145" y="450" fill="#E8DFD3" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CHEF'S KITCHEN</text>
  <text x="145" y="468" fill="#F6E05E" font-family="monospace" font-size="9" text-anchor="middle">15' 0" × 10' 6"</text>
  <text x="145" y="484" fill="#A0AEC0" font-family="sans-serif" font-size="8" text-anchor="middle">&amp; Utility Scullery</text>

  <!-- 9. Staff Quarters with Independent Service Entry -->
  <rect x="80" y="530" width="130" height="90" fill="#11151A" stroke="#4A5568" stroke-dasharray="2,2" />
  <text x="145" y="570" fill="#A0AEC0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">STAFF SUITE &amp; WC</text>
  <text x="145" y="585" fill="#A0AEC0" font-family="monospace" font-size="8" text-anchor="middle">Separate Service Core</text>

  <!-- Blueprint Title & Details -->
  <g transform="translate(100, 45)">
    <text x="0" y="0" fill="#CCAA4B" font-family="'Cinzel', serif" font-size="18" font-weight="bold">4 BHK GRAND RESIDENCE BLUEPRINT</text>
    <text x="420" y="0" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">RERA CARPET: <tspan fill="#F6E05E" font-weight="bold">2,160 SQ.FT</tspan> | USABLE: <tspan fill="#F6E05E" font-weight="bold">2,480 SQ.FT</tspan></text>
  </g>
</svg>