<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kundan Arvaana | Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var path = location.pathname;
      var parts = path.split('/');
      // If deployed under /kundanarvaana/
      if (parts[1] === 'kundanarvaana') {
        location.replace('/kundanarvaana/');
      } else {
        location.replace('/');
      }
    </script>
  </head>
  <body style="background:#07090C; color:#E8DFD3; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <p>Redirecting to Kundan Arvaana...</p>
  </body>
</html>
