<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3242" />
      <stop offset="100%" stop-color="#05141D" />
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#0A0D12" />
  <rect x="80" y="80" width="840" height="540" fill="#12161F" stroke="#CCAA4B" stroke-width="3" rx="8" />

  <!-- Great Hall (Double Volume 30ft) -->
  <rect x="180" y="160" width="460" height="310" fill="#251C12" stroke="#CCAA4B" stroke-width="2.5" />
  <text x="410" y="270" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="18" font-weight="bold" text-anchor="middle">MONUMENTAL GREAT HALL</text>
  <text x="410" y="295" fill="#F6E05E" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">42' 0" × 24' 0" • 30-FT SOARING HEIGHT</text>
  <text x="410" y="320" fill="#A0AEC0" font-family="sans-serif" font-size="10" text-anchor="middle">Internal Sculptural Spiral Staircase to Upper Penthouse Suite</text>

  <!-- Private Sky Plunge Pool -->
  <rect x="180" y="80" width="460" height="80" fill="url(#poolGrad)" stroke="#38B2AC" stroke-width="2" />
  <text x="410" y="125" fill="#81E6D9" font-family="'Cinzel', serif" font-size="14" font-weight="bold" text-anchor="middle">PRIVATE SKY PLUNGE POOL &amp; HORIZON DECK (32' 0" × 14' 0")</text>

  <!-- Entire Upper Presidential Floor -->
  <rect x="640" y="80" width="280" height="540" fill="#1A1813" stroke="#B8932C" stroke-width="2" />
  <text x="780" y="220" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="15" font-weight="bold" text-anchor="middle">PRESIDENTIAL</text>
  <text x="780" y="240" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="15" font-weight="bold" text-anchor="middle">CROWN WING</text>
  <text x="780" y="265" fill="#F6E05E" font-family="monospace" font-size="12" text-anchor="middle">26' 0" × 20' 0"</text>
  <text x="780" y="290" fill="#A0AEC0" font-family="sans-serif" font-size="9" text-anchor="middle">Dual Boutiques &amp; Private Steam Spa</text>

  <!-- Wine Cellar & Tasting Salon -->
  <rect x="180" y="470" width="230" height="150" fill="#2D1A1F" stroke="#E53E3E" stroke-width="1.5" />
  <text x="295" y="535" fill="#FEB2B2" font-family="'Cinzel', serif" font-size="12" font-weight="bold" text-anchor="middle">WINE TASTING SALON</text>
  <text x="295" y="555" fill="#F6E05E" font-family="monospace" font-size="10" text-anchor="middle">14' 0" × 12' 0"</text>

  <!-- Private Fitness & Yoga Studio -->
  <rect x="410" y="470" width="230" height="150" fill="#18231C" stroke="#48BB78" stroke-width="1.5" />
  <text x="525" y="535" fill="#9AE6B4" font-family="'Cinzel', serif" font-size="12" font-weight="bold" text-anchor="middle">PERSONAL GYM &amp; YOGA</text>
  <text x="525" y="555" fill="#F6E05E" font-family="monospace" font-size="10" text-anchor="middle">18' 0" × 12' 6"</text>

  <g transform="translate(100, 45)">
    <text x="0" y="0" fill="#CCAA4B" font-family="'Cinzel', serif" font-size="18" font-weight="bold">LIMITED EDITION SKY DUPLEX PENTHOUSE</text>
    <text x="460" y="0" fill="#E8DFD3" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">RERA CARPET: <tspan fill="#F6E05E" font-weight="bold">4,385 SQ.FT</tspan> | USABLE: <tspan fill="#F6E05E" font-weight="bold">5,120 SQ.FT</tspan></text>
  </g>
</svg>